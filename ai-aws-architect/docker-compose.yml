# Local Postgres only. In AWS this is replaced by RDS for PostgreSQL
# (or Aurora Serverless v2) - the app only ever sees DATABASE_URL.
services:
  postgres:
    image: postgres:17-alpine
    container_name: architect-postgres
    environment:
      POSTGRES_USER: architect
      POSTGRES_PASSWORD: architect
      POSTGRES_DB: architect
    ports:
      - "5432:5432"
    volumes:
      - architect-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architect -d architect"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  architect-pgdata:
