AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Grants the AI AWS Architect service scoped, revocable permission to provision
  infrastructure in this AWS account. Creates exactly one IAM role. Delete this
  stack at any time to revoke access completely.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Filled in automatically - do not edit" }
        Parameters: [ServiceAccountId, ServiceRoleName, ExternalId, RoleName]

Parameters:
  ServiceAccountId:
    Type: String
    Description: AWS account ID of the AI AWS Architect service.
    AllowedPattern: '^[0-9]{12}$'
  ServiceRoleName:
    Type: String
    Description: The single service-side role permitted to assume this role.
    Default: ai-aws-architect-provisioner
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret that pins the trust to this specific connection.
  RoleName:
    Type: String
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
    Description: Deterministic role name, so re-running this stack repairs the connection.

Resources:
  ProvisioningRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Scoped provisioning access for the AI AWS Architect service.
      MaxSessionDuration: 3600
      Tags:
        - { Key: ManagedBy, Value: ai-aws-architect }

      # WHO may become this role. Two conditions must both hold: the caller is
      # our named service role, AND it presents the external ID. The second
      # condition is what stops anyone who merely learns this role's ARN from
      # getting our service to act here on their behalf.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${ServiceAccountId}:role/${ServiceRoleName}'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

      Policies:
        # WHAT it may do. Scoped to the resource types in the vetted template
        # catalog. Note that IAM actions do not map one-to-one onto "resource
        # types": creating a VPC needs a dozen ec2 actions, so they are listed
        # explicitly rather than wildcarded.
        - PolicyName: CatalogProvisioning
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Full control over buckets this system creates, and nothing else.
              #
              # Scoping by RESOURCE rather than by ACTION is the stronger
              # guardrail. The previous version enumerated actions against
              # Resource "*", which was both weaker - it permitted CreateBucket
              # and DeleteBucket on any bucket in the account - and fragile:
              # Terraform reads every attribute back after a create, so a single
              # missed s3:Get* action breaks an apply halfway through, leaving a
              # bucket that exists but is not fully configured.
              #
              # The aiarch- prefix is enforced by the module, not by the caller,
              # so there is no parameter value that lets this reach a bucket the
              # system did not create.
              - Sid: ObjectStorageOwnBuckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::aiarch-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::aiarch-*/*'

              # Account-level and read-only. Terraform needs to resolve a
              # bucket's region before it can address it.
              - Sid: ObjectStorageDiscovery
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                Resource: '*'

              # Still enumerated against Resource "*", unlike S3, Lambda and
              # DynamoDB above. Not an oversight: CloudFront distribution and
              # OAC ids are generated by AWS, so there is no name to scope on
              # the way aiarch-* scopes the others. The mitigation is that the
              # action list is read-mostly and creates nothing outside
              # CloudFront.
              #
              # Because it is enumerated, it carries the same fragility: the
              # provider reads a distribution's attributes back after creating
              # it, so a missing Get breaks an apply halfway through and leaves
              # a half-configured distribution that takes 15 minutes to remove.
              - Sid: ContentDelivery
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  # Needed because the static-site module's distribution
                  # references the AWS managed CachingOptimized policy;
                  # CloudFront validates the id at create time. List is here so
                  # a future data-source lookup by name works without another
                  # stack update.
                  - cloudfront:GetCachePolicy
                  - cloudfront:ListCachePolicies
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                Resource: '*'

              # Same resource-scoping principle as S3: full control over
              # functions this system names, nothing elsewhere. Enumerating
              # actions against Resource "*" was both broader and fragile -
              # Terraform reads every attribute back after a create, so one
              # missing Get action breaks an apply halfway through.
              - Sid: ServerlessOwnFunctions
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:aiarch-*'
                  - !Sub 'arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:aiarch-*:*'

              # API Gateway ids are generated by AWS, so there is no name to
              # scope on. Confined to the HTTP API path instead.
              - Sid: HttpApi
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                # No TagResource/UntagResource here: API Gateway has no such
                # IAM actions. Its whole API is addressed by HTTP verb, and
                # tagging is a PUT against /tags/{arn} - already covered by the
                # verbs above plus the /tags/* resource below. IAM accepts
                # unknown action names silently and simply never matches them,
                # so the previous entries granted nothing and implied tagging
                # was handled separately.
                Resource:
                  - !Sub 'arn:${AWS::Partition}:apigateway:*::/apis'
                  - !Sub 'arn:${AWS::Partition}:apigateway:*::/apis/*'
                  - !Sub 'arn:${AWS::Partition}:apigateway:*::/tags/*'

              - Sid: NoSqlOwnTables
                Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/aiarch-*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/aiarch-*/*'

              # Budgets is a global service with no region in its ARN, and
              # budget names are the only thing to scope on.
              - Sid: CostBudgets
                Effect: Allow
                # Budgets does NOT have per-operation IAM actions. The API has
                # CreateBudget/DescribeBudget/UpdateBudget/DeleteBudget, but IAM
                # exposes exactly two: ViewBudget for every read and ModifyBudget
                # for every write. CreateBudget, DescribeBudget and DeleteBudget
                # are not action names at all - IAM ignored them, and the module
                # worked only because ModifyBudget and ViewBudget were also here.
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:TagResource
                  - budgets:UntagResource
                  - budgets:ListTagsForResource
                Resource: !Sub 'arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/aiarch-*'

              - Sid: LoggingOwnGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/aiarch-*'
                  - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/aiarch-*:*'

              # DescribeLogGroups cannot be scoped to a single group - it is a
              # list operation - but it is read-only.
              - Sid: LoggingDiscovery
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'

              # IAM is the dangerous one. Lambda and ECS need execution roles,
              # so this cannot be omitted - but it is confined by name prefix,
              # so the role can never touch an IAM entity it did not create.
              - Sid: ScopedExecutionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  # Terraform calls these before deleting a role: a role
                  # attached to an instance profile cannot be deleted, so the
                  # provider checks first. Missing them fails the destroy at
                  # the very last resource, leaving an orphaned IAM role -
                  # which is exactly what happened.
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRoleTags
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aiarch-*'

              # PassRole is how a created execution role gets handed to a
              # service. Confined to the same prefix and to the two services
              # that need it, so it cannot be used to escalate onto an
              # unrelated privileged role.
              - Sid: ScopedPassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aiarch-*'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - ecs-tasks.amazonaws.com

              # Belt and braces. Explicit denies beat any Allow above, so even a
              # mistake in the lists cannot produce an IAM user, an access key,
              # or an edit to this role's own permissions.
              - Sid: DenySelfModificationAndIdentityCreation
                Effect: Deny
                Action:
                  - iam:CreateUser
                  - iam:CreateAccessKey
                  - iam:CreateLoginProfile
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachUserPolicy
                  - iam:PutUserPolicy
                  - iam:CreatePolicyVersion
                  - iam:DeleteRolePermissionsBoundary
                  - organizations:*
                  - account:*
                Resource: '*'

              - Sid: DenyTouchingOwnRole
                Effect: Deny
                Action: iam:*
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}'

Outputs:
  RoleArn:
    Description: Copy this back into the AI AWS Architect app to finish connecting.
    Value: !GetAtt ProvisioningRole.Arn
  AccountId:
    Description: The AWS account this grant applies to.
    Value: !Ref 'AWS::AccountId'
  HowToRevoke:
    Description: How to revoke access completely.
    Value: Delete this CloudFormation stack. No coordination with the service is required.