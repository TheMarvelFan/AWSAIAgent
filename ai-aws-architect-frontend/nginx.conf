server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Vite fingerprints everything under /assets, so it can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is what points at the new bundle, so it must never be cached.
    # Without this, a deploy lands and browsers keep loading the old JS.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # There is no routing library — navigation is component state — so this is
    # belt and braces. It costs nothing and means a refresh on any path works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Health checks are noise in the access log.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
